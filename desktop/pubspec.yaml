name: autoprime_desktop
description: "AutoPrime LMS & Driving School Desktop Application"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Network & API
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  
  # State Management & DI
  provider: ^6.1.2
  
  # Storage & Device info
  shared_preferences: ^2.3.2
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.1
  
  # System
  path_provider: ^2.1.4
  open_file: ^3.5.11
  url_launcher: ^6.3.0
  
  # UI & Design
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
