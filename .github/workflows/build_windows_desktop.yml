name: Build Windows Desktop Installer (.exe)

on:
  push:
    branches:
      - lms
    paths:
      - 'desktop/**'
      - '.github/workflows/build_windows_desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build AutoPrime Windows Setup
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Install Flutter Dependencies
        working-directory: ./desktop
        run: flutter pub get

      - name: Build Windows Release Binary
        working-directory: ./desktop
        run: flutter build windows --release -v

      - name: Stage Release Files
        working-directory: ./desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "../public/downloads/desktop"
          New-Item -ItemType Directory -Force -Path "installer_source"
          
          Write-Host "Checking for release build output..."
          if (Test-Path "build/windows/x64/runner/Release") {
            Write-Host "Found build in build/windows/x64/runner/Release"
            Copy-Item -Path "build/windows/x64/runner/Release/*" -Destination "installer_source" -Recurse -Force
          } elseif (Test-Path "build/windows/runner/Release") {
            Write-Host "Found build in build/windows/runner/Release"
            Copy-Item -Path "build/windows/runner/Release/*" -Destination "installer_source" -Recurse -Force
          } else {
            Get-ChildItem -Path "build" -Recurse
            throw "Release build output folder not found!"
          }
          
          Write-Host "Staged files in installer_source:"
          Get-ChildItem -Path "installer_source"

      - name: Compile Inno Setup Single-File Installer
        working-directory: ./desktop
        shell: pwsh
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $isccPath)) {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { $isccPath = $cmd.Source }
          }
          
          Write-Host "Using Inno Setup compiler: $isccPath"
          & $isccPath windows_installer.iss

      - name: Verify Generated Installer
        shell: pwsh
        run: |
          Write-Host "Listing files in public/downloads/desktop:"
          Get-ChildItem -Path public/downloads/desktop/

      - name: Upload Windows Installer (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPrime-Setup-Windows-Installer
          path: public/downloads/desktop/AutoPrime-Setup-*.exe
          if-no-files-found: error

      - name: Upload Standalone Windows Binaries (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: AutoPrime-Windows-Standalone-Files
          path: desktop/installer_source/
          if-no-files-found: ignore
