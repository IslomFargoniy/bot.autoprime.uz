name: Build Windows Desktop Installer (.exe)

on:
  push:
    branches:
      - lms
    paths:
      - 'desktop/**'
      - '.github/workflows/build_windows_desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build AutoPrime Windows Setup
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Install Flutter Dependencies
        working-directory: ./desktop
        run: flutter pub get

      - name: Build Windows Release Binary
        working-directory: ./desktop
        run: flutter build windows --release

      - name: Stage Release Files
        working-directory: ./desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "../public/downloads/desktop"
          New-Item -ItemType Directory -Force -Path "installer_source"
          
          if (Test-Path "build/windows/x64/runner/Release") {
            Copy-Item -Path "build/windows/x64/runner/Release/*" -Destination "installer_source" -Recurse -Force
          } elseif (Test-Path "build/windows/runner/Release") {
            Copy-Item -Path "build/windows/runner/Release/*" -Destination "installer_source" -Recurse -Force
          } else {
            Write-Error "Release build output folder not found!"
          }

      - name: Compile Inno Setup Single-File Installer
        working-directory: ./desktop
        shell: pwsh
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc windows_installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows_installer.iss
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files\Inno Setup 6\ISCC.exe" windows_installer.iss
          } else {
            $iscc = (Get-ChildItem -Path "C:\Program Files*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
            if ($iscc) {
              & $iscc windows_installer.iss
            } else {
              Write-Error "ISCC.exe not found!"
            }
          }

      - name: Verify Generated Installer
        shell: pwsh
        run: |
          Get-ChildItem -Path public/downloads/desktop/

      - name: Upload Windows Installer (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPrime-Setup-Windows-Installer
          path: public/downloads/desktop/AutoPrime-Setup-*.exe
          if-no-files-found: error

      - name: Upload Standalone Windows Binaries (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: AutoPrime-Windows-Standalone-Files
          path: desktop/installer_source/
          if-no-files-found: ignore
